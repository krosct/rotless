# rotless's specifics for devkit (https://github.com/krosct/devkit), which does everything else:
# running it here (deploy.sh local), publishing to the VPS (deploy.sh vps HOST) and CI deploys
# (.github/workflows/deploy.yml). On the VPS: /srv/rotless, with each release in releases/, the
# server's .env next to them, Laravel's storage in data/storage and HTTPS by the shared Caddy.
# rotless is a Docker stack: the Compose project is always "rotless" (database volume
# rotless_db-data) and each release has its image, rotless-app:<release>.
APP=rotless
# Local: the Docker stack and the Vite dev server (frontend/package.json "dev").
DEV="cd frontend && npm install --no-audit --no-fund && npm run dev"
# On this machine or the CI runner: npm ci + vite build would push the 1 GB VPS into swap.
BUILD="cd frontend && npm ci --no-audit --no-fund && npm run build"
INCLUDE="frontend/dist"
# In the new release folder, while the running one keeps serving: storage folders, the image,
# a database dump in data/backups (newest 10 kept), pending migrations (additive only) and
# removal of the images of releases devkit no longer keeps.
INSTALL="R=$(cd ../.. && pwd); E=$R/.devkit/env.new; [ -f $E ] || E=$R/.env; export ROTLESS_TAG=$(basename $PWD) ROTLESS_ENV_FILE=$E ROTLESS_STORAGE=$R/data/storage; S=$ROTLESS_STORAGE; dc() { docker compose -p rotless -f docker-compose.yml -f docker-compose.prod.yml --env-file $E "$@"; }; set -e; mkdir -p $S/app/public $S/app/private $S/logs $S/framework/cache/data $S/framework/sessions $S/framework/views $R/data/backups; docker build -q --network host -t rotless-app:$ROTLESS_TAG .; dc up -d --wait db; (umask 077; dc exec -T db sh -c 'pg_dump -U $POSTGRES_USER $POSTGRES_DB' | gzip > $R/data/backups/rotless-$ROTLESS_TAG.sql.gz); ls -1t $R/data/backups/*.sql.gz | tail -n +11 | xargs -r rm -f; dc run --rm --no-deps app php artisan migrate --force; for t in $(docker image ls rotless-app --format '{{.Tag}}'); do [ -d ../$t ] || docker image rm rotless-app:$t >/dev/null || true; done"
# The stack of this release (only what changed is recreated; the database keeps running), then
# its logs. Stopping the service stops only the logs: docker compose -p rotless stop stops rotless.
RUN="bash -c 'export ROTLESS_TAG=$(basename $PWD); dc() { docker compose -p rotless --profile caddy -f docker-compose.yml -f docker-compose.prod.yml --env-file {root}/.env "$@"; }; dc up -d --no-build --remove-orphans && dc logs -f --since 1m'"
SERVICE_ENV="ROTLESS_ENV_FILE={root}/.env ROTLESS_STORAGE={data}/storage ROTLESS_HTTP_PORT={port}"
HEALTH=/api/v1/health
REQUIRED="APP_KEY APP_URL DB_PASSWORD"
