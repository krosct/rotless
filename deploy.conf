# rotless's specifics for devkit (https://github.com/krosct/devkit), which does everything else:
# running it here (deploy.sh local), publishing to the VPS (deploy.sh vps HOST) and CI deploys
# (.github/workflows/deploy.yml). On the VPS: /srv/rotless, with each release in releases/, the
# server's .env next to them, Laravel's storage in data/storage and HTTPS by the shared Caddy.
APP=rotless
# Local: the Docker stack and the Vite dev server (frontend/package.json "dev").
DEV="cd frontend && npm install --no-audit --no-fund && npm run dev"
# On this machine or the CI runner, before packaging: npm ci + vite build would push the 1 GB VPS
# into swap.
BUILD="cd frontend && npm ci --no-audit --no-fund && npm run build"
INCLUDE="frontend/dist"
# While the running release keeps serving: image build, database backup, pending migrations.
INSTALL="bash scripts/devkit-install.sh"
# The Docker stack of this release; the service follows its logs.
RUN="bash scripts/devkit-run.sh"
HEALTH=/api/v1/health
REQUIRED="APP_KEY APP_URL DB_PASSWORD"
SERVICE_ENV="ROTLESS_HTTP_PORT={port}"
