# rotless's specifics for devkit (https://github.com/krosct/devkit), which does everything else:
# running it here (deploy.sh local), publishing to the VPS (deploy.sh vps HOST) and CI deploys
# (.github/workflows/deploy.yml, which also sends the settings). On the VPS: /srv/rotless, with
# each release in releases/, the server's .env next to them, Laravel's storage in data/storage and
# HTTPS by the shared Caddy. The app runs on the system, with PHP from the FrankenPHP static binary
# in tools/ (nothing to install on the VPS); only PostgreSQL runs in Docker (docker-compose.yml,
# database volume rotless_db-data).
APP=rotless
# Local: PostgreSQL in Docker, the API on http://localhost:8000 and Vite on http://localhost:5173
# (it proxies /api to the API). Ctrl+C stops both; the database keeps running.
DEV="trap 'kill 0' EXIT; docker compose up -d --wait db && composer install && php artisan migrate && { php artisan serve --host=127.0.0.1 --port=8000 & } && cd frontend && npm install --no-audit --no-fund && npm run dev"
# On this machine or the CI runner: npm ci + vite build would push the 1 GB VPS into swap.
BUILD="cd frontend && npm ci --no-audit --no-fund && npm run build"
INCLUDE="frontend/dist"
# In the new release folder, while the running one keeps serving: FrankenPHP (PHP and its web
# server) and Composer in tools/ (pinned, checksum verified; a "php" there runs FrankenPHP's CLI),
# storage linked to data/storage, the PHP dependencies (vendor/ copied from the running release when
# composer.lock did not change), a database dump in data/backups (newest 10 kept) and pending
# migrations (additive only), with the settings of this deploy.
INSTALL="set -eo pipefail; R=$(cd ../.. && pwd); T=$R/tools/frankenphp-1.12.7; C=$R/tools/composer-2.9.5.phar; E=$R/.devkit/env.new; [ -f $E ] || E=$R/.env; mkdir -p $T; if [ ! -x $T/frankenphp ]; then case $(uname -m) in x86_64) A=x86_64 H=82c2bb1576c8e472d28e8c03e2bed37dccb626e231c382330e677d7d165979ae;; aarch64) A=aarch64 H=6a6b95189bf39cc136962121b2eb56b05b1cd87fde6449d239b9c24d46af3f5a;; esac; curl -fsSL --retry 3 -o $T/frankenphp.new https://github.com/php/frankenphp/releases/download/v1.12.7/frankenphp-linux-$A; sha256sum $T/frankenphp.new | grep -q ^$H; chmod 755 $T/frankenphp.new; mv $T/frankenphp.new $T/frankenphp; fi; printf '#!/bin/sh\nexec %s/frankenphp php-cli "$@"\n' $T > $T/php; chmod 755 $T/php; if [ ! -f $C ]; then curl -fsSL --retry 3 -o $C.new https://getcomposer.org/download/2.9.5/composer.phar; sha256sum $C.new | grep -q ^c86ce603fe836bf0861a38c93ac566c8f1e69ac44b2445d9b7a6a17ea2e9972a; mv $C.new $C; fi; export PATH=$T:$PATH PHP_BINARY=$T/php COMPOSER_HOME=$R/.cache/composer; while IFS= read -r l; do case $l in [A-Za-z_]*=*) export "$l";; esac; done < $E; S=$R/data/storage; mkdir -p $S/app/public $S/app/private $S/logs $S/framework/cache/data $S/framework/sessions $S/framework/views $R/data/backups; rm -rf storage; ln -s $S storage; if [ -d $R/current/vendor ] && cmp -s $R/current/composer.lock composer.lock; then cp -a $R/current/vendor vendor; fi; php $C install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts; php artisan package:discover; docker compose up -d --wait db; (umask 077; docker compose exec -T db sh -c 'pg_dump -U $POSTGRES_USER $POSTGRES_DB' | gzip > $R/data/backups/rotless-$(basename $PWD).sql.gz); ls -1t $R/data/backups/*.sql.gz | tail -n +11 | xargs -r rm -f; php artisan migrate --force"
# The database (started if it is not running), the queue worker and the scheduler (each restarted
# if it exits) and, in the foreground, FrankenPHP with the Caddyfile: Laravel for /api/*, the SPA
# for the rest. Stopping the service stops all but the database.
RUN="bash -c 'docker compose up -d --wait --remove-orphans db && { while :; do php artisan queue:work --max-time=3600; sleep 5; done & } && { while :; do php artisan schedule:work; sleep 5; done & } && exec frankenphp run --config Caddyfile --adapter caddyfile'"
SERVICE_ENV="PATH={root}/tools/frankenphp-1.12.7:/usr/local/bin:/usr/bin:/bin PHP_BINARY={root}/tools/frankenphp-1.12.7/php ROTLESS_HTTP_PORT={port}"
HEALTH=/api/v1/health
REQUIRED="APP_KEY APP_URL"
# The database password: generated on the first deploy, kept on the server (the database was
# created with it). The other settings come from the deploy workflow.
PRESERVE="DB_PASSWORD"
