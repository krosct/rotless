# Label taxonomy for rotless. Source of truth synced to the repository by
# .github/workflows/labels.yml (crazy-max/ghaction-github-labeler), which reads
# this file on push to main.
#
# Grouping: type:* (kind of change), area:* (where it lives), priority:* (urgency),
# status:* (workflow state). Keep `area:*` names in sync with .github/labeler.yml.

# --- type: kind of change (matches Conventional Commits types) ---
- name: "type: feature"
  color: "#0e8a16"
  description: "New feature (feat)"
- name: "type: fix"
  color: "#d73a4a"
  description: "Bug fix (fix)"
- name: "type: hotfix"
  color: "#b60205"
  description: "Urgent production fix (hotfix)"
- name: "type: chore"
  color: "#c5def5"
  description: "Maintenance, tooling or dependencies (chore)"
- name: "type: docs"
  color: "#0075ca"
  description: "Documentation only (docs)"
- name: "type: refactor"
  color: "#1d76db"
  description: "Code change with no behavior change (refactor)"
- name: "type: test"
  color: "#fbca04"
  description: "Tests only (test)"
- name: "type: ci"
  color: "#5319e7"
  description: "CI/CD configuration (ci)"
- name: "type: perf"
  color: "#d4c5f9"
  description: "Performance improvement (perf)"
- name: "type: build"
  color: "#006b75"
  description: "Build system or packaging (build)"

# --- area: where the change lives (applied automatically by path) ---
- name: "area: backend"
  color: "#1f6feb"
  description: "Laravel API, routes, config, tests"
- name: "area: frontend"
  color: "#7057ff"
  description: "React + TypeScript SPA"
- name: "area: database"
  color: "#006b75"
  description: "Migrations, seeders, schema"
- name: "area: infra"
  color: "#0e8a16"
  description: "Docker, Caddy, scripts, root config"
- name: "area: ci"
  color: "#5319e7"
  description: "GitHub Actions workflows"
- name: "area: docs"
  color: "#0075ca"
  description: "Markdown and project documentation"

# --- priority ---
- name: "priority: high"
  color: "#b60205"
  description: "Must be addressed next"
- name: "priority: medium"
  color: "#fbca04"
  description: "Normal priority"
- name: "priority: low"
  color: "#cfd8d7"
  description: "Nice to have, not urgent"

# --- status ---
- name: "status: needs-review"
  color: "#fbca04"
  description: "Waiting for review"
- name: "status: blocked"
  color: "#b60205"
  description: "Blocked by something else"
- name: "status: wip"
  color: "#c5def5"
  description: "Work in progress, do not merge"
