name: Labels

on:
    push:
        branches:
            - main
        paths:
            - .github/labels.yml
            - .github/workflows/labels.yml
    pull_request:
        paths:
            - .github/labels.yml
            - .github/workflows/labels.yml
    workflow_dispatch:

permissions:
    contents: read
    issues: write

jobs:
    sync:
        name: Sync labels
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            # skip-delete keeps labels that are not listed in labels.yml (e.g. GitHub
            # defaults). Flip it to false once the taxonomy fully replaces them.
            - name: Sync GitHub labels
              uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  yaml-file: .github/labels.yml
                  dry-run: ${{ github.event_name == 'pull_request' }}
                  skip-delete: true
