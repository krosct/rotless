name: Deploy

# Deploys main to the VPS after CI passes on it, with devkit (krosct/devkit, pinned version) from
# deploy.conf: it builds the frontend here, sends the release over SSH, runs it next to the other
# apps of the VPS behind their shared Caddy, rolls back if it does not stay up and checks the
# public address. The job uses the "production" environment, which requires a manual approval
# (Settings > Environments), so nothing reaches the VPS without an explicit confirmation.
#
# The app settings are the server's .env (/srv/rotless/.env); this workflow sends none.
# This repository is public, and so are its Actions logs: the VPS address and user are secrets
# so they stay masked.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

permissions:
    contents: read

# One deploy at a time; a queued run waits instead of cancelling the running one.
concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to VPS
        # Only CI runs of a push to main in this repository: a pull request from
        # a fork whose branch is also named "main" matches the filter above too.
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 60
        environment: production
        steps:
            - name: Checkout the commit CI tested
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  # Full history and tags: the footer shows `git describe`.
                  fetch-depth: 0
                  persist-credentials: false

            # BUILD (deploy.conf) runs here: the VPS needs no Node.
            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Deploy
              uses: krosct/devkit@v1.1.0
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  user: ${{ secrets.DEPLOY_USER }}
                  port: ${{ vars.DEPLOY_PORT || '22' }}
                  ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
                  known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
