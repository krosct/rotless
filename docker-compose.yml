# Only PostgreSQL runs in Docker; the app runs on the system (deploy.conf). The project is always
# "rotless", locally and on the VPS, so the database volume is always rotless_db-data.
#   docker compose up -d --wait db
# It reads DB_DATABASE, DB_USERNAME and DB_PASSWORD from the environment: the server's .env on the
# VPS (devkit), the project's .env locally.
name: rotless

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Lean settings so Postgres fits on a small VPS without starving the app.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    # Same credentials the app reads from .env (DB_*). They only apply when the
    # db-data volume is first created; to rotate the password of an existing
    # database run ALTER USER, then update DB_PASSWORD in .env.
    # There is no default password: compose refuses to start without one.
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rotless}
      POSTGRES_USER: ${DB_USERNAME:-rotless}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (e.g. openssl rand -hex 32)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
