services:
  app:
    build:
      context: .
      network: host
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Lean settings so Postgres fits on a small VPS without starving the app.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    # Same credentials the app reads from .env (DB_*). They only apply when the
    # db-data volume is first created; changing them later does not alter an
    # existing database.
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rotless}
      POSTGRES_USER: ${DB_USERNAME:-rotless}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rotless}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: ["php", "artisan", "queue:work"]
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  # HTTPS reverse proxy: serves the SPA and forwards /api/* to Laravel.
  # Only runs when the "caddy" profile is enabled (production):
  #   docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_URL: ${APP_URL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config: