services:
  app:
    build:
      context: .
      network: host
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # The FrankenPHP image checks its admin API, which docker/frankenphp/Caddyfile
    # turns off; probe Laravel's /up route instead (no DB, not exposed by Caddy).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Lean settings so Postgres fits on a small VPS without starving the app.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
    # Same credentials the app reads from .env (DB_*). They only apply when the
    # db-data volume is first created; to rotate the password of an existing
    # database run ALTER USER, then update DB_PASSWORD in .env.
    # There is no default password: compose refuses to start without one.
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rotless}
      POSTGRES_USER: ${DB_USERNAME:-rotless}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (e.g. openssl rand -hex 32)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: ["php", "artisan", "queue:work"]
    # Runs an artisan command, not the web server: no HTTP health check.
    healthcheck:
      disable: true
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    # Runs an artisan command, not the web server: no HTTP health check.
    healthcheck:
      disable: true
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  # HTTPS reverse proxy: serves the SPA and forwards /api/* to Laravel.
  # Only runs when the "caddy" profile is enabled (production):
  #   docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_URL: ${APP_URL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      # Cloudflare Origin Certificate (origin.pem + origin.key), only on the server.
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config: